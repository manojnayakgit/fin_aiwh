# fin_aiwh data contract
#
# This file is the agreement, not a description. The warehouse is compared
# against it on every detector run. Changing it is a reviewed pull request.

dataset: RAW.AP_ACCRUAL
version: 1
owner: unassigned-needs-review
classification: financial-restricted
description: Accounts payable accruals for expense recognition.

primary_key:
  - ACCRUAL_ID

freshness:
  column: LOADED_AT
  max_lag_hours: 24

# Columns the contract guarantees. A column present here and missing in the
# warehouse is a break. A column in the warehouse and missing here is
# ungoverned and must be adopted or rejected explicitly.
columns:
  - name: ACCRUAL_ID
    type: TEXT
    length: 32
    nullable: false
    description: Surrogate key for the accrual record (inferred from column name and type).
  - name: ENTITY_CODE
    type: TEXT
    length: 8
    nullable: false
    description: Legal entity code for the accrual (inferred from column name and type).
  - name: GL_ACCOUNT
    type: TEXT
    length: 16
    nullable: false
    description: General ledger account code for the accrual (inferred from column name and type).
  - name: PERIOD
    type: TEXT
    length: 7
    nullable: false
    description: Accounting period for the accrual, likely YYYY-MM format (inferred from column name and type).
  - name: ACCRUAL_AMOUNT
    type: NUMBER
    precision: 18
    scale: 2
    nullable: false
    description: Monetary amount of the accrual (inferred from column name and type).
  - name: CURRENCY_CODE
    type: TEXT
    length: 3
    nullable: false
    description: ISO 4217 currency code for the accrual amount (inferred from column name and type).
  - name: LOADED_AT
    type: TIMESTAMP_NTZ
    nullable: false
    description: Ingestion watermark.
