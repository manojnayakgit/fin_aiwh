# fin_aiwh data contract
#
# This file is the agreement, not a description. The warehouse is compared
# against it on every detector run. Changing it is a reviewed pull request.

dataset: RAW.AR_CUSTOMER
version: 1
owner: finance-data-engineering
classification: financial-restricted
description: Customer master from the source ERP.

primary_key:
  - CUSTOMER_ID

freshness:
  column: LOADED_AT
  max_lag_hours: 24

# Columns the contract guarantees. A column present here and missing in the
# warehouse is a break. A column in the warehouse and missing here is
# ungoverned and must be adopted or rejected explicitly.
columns:
  - name: CUSTOMER_ID
    type: TEXT
    length: 32
    nullable: false
    description: Natural key from the ERP customer master.
  - name: CUSTOMER_NAME
    type: TEXT
    length: 200
    nullable: false
    description: Legal name as registered.
  - name: COUNTRY_CODE
    type: TEXT
    length: 2
    nullable: true
    description: ISO 3166-1 alpha-2 of the billing address.
  - name: CREDIT_LIMIT
    type: NUMBER
    precision: 18
    scale: 2
    nullable: true
    description: Approved credit limit, reporting currency.
  - name: PAYMENT_TERMS
    type: TEXT
    length: 16
    nullable: true
    description: Terms code, for example NET45.
  - name: IS_ACTIVE
    type: BOOLEAN
    nullable: false
    description: False once the customer is on credit hold.
  - name: CREATED_AT
    type: TIMESTAMP_NTZ
    nullable: false
    description: Customer record creation time in the source system.
  - name: LOADED_AT
    type: TIMESTAMP_NTZ
    nullable: false
    description: Ingestion watermark.
