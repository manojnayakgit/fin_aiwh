# fin_aiwh data contract
#
# This file is the agreement, not a description. The warehouse is compared
# against it on every detector run. Changing it is a reviewed pull request.

dataset: RAW.AP_VENDOR
version: 1
owner: finance-data-engineering
classification: financial-restricted
description: Vendor master from the source ERP.

primary_key:
  - VENDOR_ID

freshness:
  column: LOADED_AT
  max_lag_hours: 24

# Columns the contract guarantees. A column present here and missing in the
# warehouse is a break. A column in the warehouse and missing here is
# ungoverned and must be adopted or rejected explicitly.
columns:
  - name: VENDOR_ID
    type: TEXT
    length: 32
    nullable: false
    description: Natural key from the ERP vendor master.
  - name: VENDOR_NAME
    type: TEXT
    length: 200
    nullable: false
    description: Legal name as registered.
  - name: COUNTRY_CODE
    type: TEXT
    length: 2
    nullable: true
    description: ISO 3166-1 alpha-2 of the vendor's registered address.
  - name: PAYMENT_TERMS
    type: TEXT
    length: 16
    nullable: true
    description: Terms code, for example NET30.
  - name: TAX_ID
    type: TEXT
    length: 64
    nullable: true
    description: Tax registration number. Restricted.
  - name: IS_ACTIVE
    type: BOOLEAN
    nullable: false
    description: False once the vendor is blocked for payment.
  - name: CREATED_AT
    type: TIMESTAMP_NTZ
    nullable: false
    description: Vendor record creation time in the source system.
  - name: LOADED_AT
    type: TIMESTAMP_NTZ
    nullable: false
    description: Ingestion watermark.
